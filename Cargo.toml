[package]
name = "rustinfo"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "HWiNFO-style Linux hardware monitor in Rust (sysfs/procfs native, TUI + CSV logging)"

[dependencies]
anyhow = "1"
chrono = "0.4"
libc = "0.2"
ratatui = "0.29"
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true
